global:
  scrape_interval: 15s        # Как часто собирать метрики
  evaluation_interval: 15s    # Как часто проверять алерты

scrape_configs:
  # 1. Сам Prometheus (мониторит себя)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Node Exporter (метрики VM)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # 3. Backend (если добавим /metrics endpoint)
  - job_name: 'backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:3000']
