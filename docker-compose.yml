version: '3.8'

services:
  # 1. База данных PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: task-db
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass
      POSTGRES_DB: taskdb
    volumes:
      # Монтируем init.sql, чтобы он выполнился при первом старте
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      # Постоянное хранилище для данных PostgreSQL (чтобы не терялись при перезапуске)
      - pgdata:/var/lib/postgresql/data
    networks:
      - task-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d taskdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend (Node.js + Express)
  backend:
    build: ./backend
    container_name: task-backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: taskuser
      DB_PASSWORD: taskpass
      DB_NAME: taskdb
    depends_on:
      db:
        condition: service_healthy
    networks:
      - task-net
    restart: unless-stopped

  # 3. Nginx (фронтенд + reverse proxy)
  nginx:
    image: nginx:alpine
    container_name: task-nginx
    ports:
      - "8080:80"   # Снаружи порт 8080, внутри — 80
    volumes:
      # Монтируем фронтенд (статика)
      - ./frontend:/usr/share/nginx/html:ro
      # Монтируем наш конфиг nginx
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - task-net
    restart: unless-stopped

# Сеть, в которой общаются все контейнеры
networks:
  task-net:
    driver: bridge

# Тома для постоянного хранения данных
volumes:
  pgdata:
